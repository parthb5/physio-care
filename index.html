<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --pink:#D4537E;--pink-light:#FBEAF0;--pink-mid:#F4C0D1;--pink-dark:#72243E;
  --teal:#1D9E75;--teal-light:#E1F5EE;--teal-mid:#9FE1CB;--teal-dark:#085041;
  --purple:#7F77DD;--purple-light:#F0EFFE;--orange:#D85A30;--orange-light:#FEF0EB;
  --bg:#f7f7f8;--card:#fff;--border:#e8e8e8;--text:#1a1a1a;--muted:#6b7280;
}
html,body{height:100%;background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);max-width:430px;margin:0 auto;overflow-x:hidden;}

/* SPLASH */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;text-align:center;}
.logo-ring{width:96px;height:96px;border-radius:50%;overflow:hidden;margin-bottom:22px;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both;}
.logo-ring img{width:100%;height:100%;object-fit:cover;}
.brand-row1{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.brand-row2{font-size:26px;font-weight:800;color:var(--teal);letter-spacing:-.4px;}
.brand-sub{font-size:12px;color:var(--pink);font-weight:700;letter-spacing:1px;margin-top:6px;text-transform:uppercase;}
.splash-divider{width:44px;height:2.5px;background:var(--pink-mid);border-radius:2px;margin:18px auto;}
.tagline{font-size:15px;color:var(--muted);line-height:1.65;max-width:260px;}
.greet-line{font-size:13px;color:var(--muted);margin-top:8px;margin-bottom:28px;font-style:italic;}
.splash-btn{background:var(--pink);color:#fff;border:none;border-radius:18px;padding:16px 44px;font-size:17px;font-weight:700;cursor:pointer;}
.splash-stats{display:flex;gap:24px;margin-top:30px;}
.splash-stat-val{font-size:22px;font-weight:800;color:var(--teal);}
.splash-stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
.version-tag{font-size:10px;color:#ccc;margin-top:20px;}
@keyframes popIn{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}

/* APP */
#app{display:none;}
.app-header{background:var(--card);border-bottom:0.5px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:50;}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.header-brand{display:flex;align-items:center;gap:10px;}
.header-logo{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.header-logo img{width:100%;height:100%;object-fit:cover;}
.header-title{font-size:16px;font-weight:800;}
.header-title span{color:var(--pink);}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.header-add{background:var(--pink);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:22px;flex-shrink:0;}

/* Tabs */
.tab-bar{display:flex;background:var(--card);border-bottom:0.5px solid var(--border);overflow-x:auto;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:64px;padding:10px 4px 9px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
.tab i{font-size:20px;}
.tab.active{color:var(--pink);border-bottom-color:var(--pink);}

/* Screens */
.screen{display:none;padding:14px 14px 90px;animation:fadeUp .2s ease both;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards + badges */
.card{background:var(--card);border-radius:16px;border:0.5px solid var(--border);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s;}
.card:active{border-color:var(--pink);}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.p-name{font-size:15px;font-weight:700;}
.p-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-due{background:var(--pink-light);color:var(--pink-dark);}
.b-credit{background:var(--teal-light);color:var(--teal-dark);}
.b-ok{background:#f0f0f0;color:#555;}
.b-remind{background:#fff8e1;color:#92620a;}
.b-lead{background:var(--purple-light);color:var(--purple);}
.b-scheduled{background:var(--teal-light);color:var(--teal-dark);}

/* Summary strip */
.summary-strip{display:flex;gap:8px;margin-bottom:12px;}
.strip-card{flex:1;background:var(--card);border-radius:12px;border:0.5px solid var(--border);padding:10px 8px;text-align:center;}
.strip-val{font-size:15px;font-weight:800;}
.strip-lbl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;}

/* Search */
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#bbb;font-size:17px;pointer-events:none;}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border:0.5px solid var(--border);border-radius:13px;font-size:14px;background:var(--card);outline:none;color:var(--text);font-family:inherit;}
.search-wrap input:focus{border-color:var(--pink);}

/* Detail */
.back-row{display:flex;align-items:center;gap:4px;padding:8px 0 4px;cursor:pointer;color:var(--pink);font-size:14px;font-weight:700;border:none;background:none;margin-bottom:6px;}
.det-header{background:var(--card);border-radius:18px;border:0.5px solid var(--border);padding:16px;margin-bottom:10px;}
.det-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.det-name{font-size:20px;font-weight:800;}
.det-phone{font-size:13px;color:var(--muted);margin-top:2px;}
.big-bal{font-size:26px;font-weight:900;text-align:center;padding:8px 0 2px;}
.bal-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px;}
.action-row{display:flex;gap:6px;flex-wrap:wrap;}
.act-btn{flex:1;min-width:56px;padding:10px 4px;border:0.5px solid var(--border);border-radius:13px;background:var(--card);font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);transition:background .15s,transform .1s;}
.act-btn i{font-size:20px;}
.act-btn:active{transform:scale(0.96);}
.act-visit{color:var(--teal);border-color:var(--teal-mid);}
.act-pay{color:var(--pink);border-color:var(--pink-mid);}
.act-remind-on{color:#92620a;background:#fff8e1;border-color:#f0c040;}
.act-edit{color:var(--muted);}
.act-schedule{color:var(--purple);border-color:#c5c2f5;}
.sec-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin:14px 0 7px 2px;}
.log-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:4px;}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:0.5px solid #f3f3f3;}
.log-item:last-child{border-bottom:none;}
.log-d{font-size:13px;font-weight:500;}
.log-n{font-size:11px;color:var(--muted);margin-top:2px;}
.log-amt{font-size:14px;font-weight:800;}
.log-edit{background:none;border:none;cursor:pointer;color:#bbb;padding:4px;font-size:16px;flex-shrink:0;margin-left:8px;}
.log-edit:active{color:var(--pink);}
.amt-charge{color:var(--pink);}
.amt-pay{color:var(--teal);}
.history-box{background:#f7f7f8;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:4px;}

/* Schedule card */
.sched-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.sched-dot{width:10px;height:10px;border-radius:50%;background:var(--purple);flex-shrink:0;}
.sched-dot.past{background:#ccc;}
.sched-info{flex:1;}
.sched-date{font-size:13px;font-weight:700;}
.sched-note{font-size:11px;color:var(--muted);margin-top:2px;}
.sched-recur{font-size:10px;color:var(--purple);font-weight:700;margin-top:3px;}

/* Quick btn */
.quick-btn{width:100%;background:var(--pink);color:#fff;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;}

/* Export row */
.export-row{display:flex;gap:8px;margin-top:8px;}
.exp-btn{flex:1;padding:10px 4px;border:0.5px solid var(--border);border-radius:13px;background:var(--card);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#555;transition:background .15s,transform .1s;}
.exp-btn i{font-size:20px;}
.exp-btn:active{transform:scale(0.96);}
.exp-btn.exp-pdf{color:#c0392b;border-color:#f5c0b0;}
.exp-btn.exp-csv{color:#1a7a40;border-color:#9FE1CB;}
.exp-all-row{display:flex;gap:8px;margin-bottom:12px;}
.exp-all-btn{flex:1;padding:11px;border:0.5px solid var(--border);border-radius:13px;background:var(--card);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.exp-all-btn.pdf{color:#c0392b;border-color:#f5c0b0;}
.exp-all-btn.csv{color:#1a7a40;border-color:#9FE1CB;}

/* Lead cards */
.lead-card{background:var(--card);border-radius:16px;border:0.5px solid var(--border);padding:13px 14px;margin-bottom:9px;cursor:pointer;}
.lead-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
.ls-new{background:var(--purple-light);color:var(--purple);}
.ls-followup{background:#fff8e1;color:#92620a;}
.ls-converted{background:var(--teal-light);color:var(--teal-dark);}
.followup-date{font-size:12px;color:#92620a;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:4px;}

/* Update banner */
.update-banner{background:#1a1a1a;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;}
.update-banner.hidden{display:none;}
.update-btn{background:var(--pink);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.hidden{display:none;}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px 40px;max-height:90vh;overflow-y:auto;}
.modal-pill{width:38px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.modal-title i{color:var(--pink);}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:13px 0 5px;text-transform:uppercase;letter-spacing:.5px;}
label:first-of-type{margin-top:0;}
input,select,textarea{width:100%;border:0.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;color:var(--text);background:var(--card);appearance:none;-webkit-appearance:none;}
textarea{resize:none;line-height:1.5;}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(212,83,126,.1);}
.m-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;font-family:inherit;}
.m-btn-pink{background:var(--pink);color:#fff;}
.m-btn-ghost{background:#f0f0f0;color:var(--muted);margin-top:9px;}
.m-btn-danger{background:#ff3b30;color:#fff;margin-top:9px;}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:14px;line-height:1.6;}
.empty i{font-size:44px;display:block;margin-bottom:12px;color:#ddd;}
</style>
</head>
<body>

<div class="update-banner hidden" id="update-banner">
  <span>New version available!</span>
  <button class="update-btn" onclick="applyUpdate()">Update now</button>
</div>

<script>
const APP_VERSION='v2.0.0';

/* ── DATA ── */
const SK='vpc_v1';
function gd(){try{return JSON.parse(localStorage.getItem(SK)||'{"patients":[],"visits":[],"payments":[],"schedules":[],"reminders":[],"leads":[]}')}catch(e){return{patients:[],visits:[],payments:[],schedules:[],reminders:[],leads:[]};}}
function sd(d){localStorage.setItem(SK,JSON.stringify(d));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
// Ensure old data has new arrays
function ensureData(d){
  if(!d.schedules)d.schedules=[];
  if(!d.reminders)d.reminders=[];
  if(!d.leads)d.leads=[];
  return d;
}

/* ── BALANCE ── */
function bal(pid){
  const d=gd();
  const c=d.visits.filter(v=>v.pid===pid).reduce((a,v)=>a+Number(v.charge),0);
  const p=d.payments.filter(x=>x.pid===pid).reduce((a,x)=>a+Number(x.amount),0);
  return p-c;
}

/* ── HELPERS ── */
const COLORS=['#D4537E','#1D9E75','#7F77DD','#D85A30','#185FA5','#BA7517','#993556','#0F6E56'];
function acolor(n){let h=0;for(let c of n)h+=c.charCodeAt(0);return COLORS[h%COLORS.length];}
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function fmtDate(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDateShort(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtAmt(n){return '₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');}
function bgClose(e,id){if(e.target.id===id)closeModal(id);}
function closeModal(id){document.getElementById(id).classList.add('hidden');}
function todayStr(){return new Date().toISOString().slice(0,10);}
function nowTime(){return new Date().toTimeString().slice(0,5);}

/* ── SERVICE WORKER ── */
let swReg=null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    swReg=reg;
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller)
          document.getElementById('update-banner').classList.remove('hidden');
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
function applyUpdate(){if(swReg&&swReg.waiting)swReg.waiting.postMessage('SKIP_WAITING');}

/* ── SPLASH ── */
function greetText(){
  const h=new Date().getHours();
  const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return g+', Vanshika! Happy '+days[new Date().getDay()]+'.';
}
function initSplash(){
  document.getElementById('greet-line').textContent=greetText();
  document.getElementById('version-tag').textContent=APP_VERSION;
  const d=ensureData(gd());
  if(d.patients.length>0){
    const out=d.patients.reduce((a,p)=>{const b=bal(p.id);return b<0?a+Math.abs(b):a;},0);
    const rems=d.reminders.filter(r=>!r.done).length;
    document.getElementById('splash-stats').innerHTML=
      `<div class="splash-stat"><div class="splash-stat-val">${d.patients.length}</div><div class="splash-stat-lbl">Patients</div></div>
       <div class="splash-stat"><div class="splash-stat-val" style="color:var(--pink)">${fmtAmt(out)}</div><div class="splash-stat-lbl">Outstanding</div></div>
       <div class="splash-stat"><div class="splash-stat-val" style="color:#b7770d">${rems}</div><div class="splash-stat-lbl">Reminders</div></div>`;
  }
}
function enterApp(){
  document.getElementById('splash').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('header-version').textContent=APP_VERSION;
  renderPatients();
}

/* ── STRIP ── */
function renderStrip(){
  const d=ensureData(gd());
  const out=d.patients.reduce((a,p)=>{const b=bal(p.id);return b<0?a+Math.abs(b):a;},0);
  const cr=d.patients.reduce((a,p)=>{const b=bal(p.id);return b>0?a+b:a;},0);
  const rems=d.reminders.filter(r=>!r.done).length;
  document.getElementById('strip').innerHTML=
    `<div class="summary-strip">
      <div class="strip-card"><div class="strip-val" style="color:var(--pink)">${fmtAmt(out)}</div><div class="strip-lbl">Outstanding</div></div>
      <div class="strip-card"><div class="strip-val" style="color:var(--teal)">${fmtAmt(cr)}</div><div class="strip-lbl">Credit</div></div>
      <div class="strip-card"><div class="strip-val" style="color:#b7770d">${rems}</div><div class="strip-lbl">Reminders</div></div>
    </div>`;
}

/* ── PATIENTS ── */
function renderPatients(){
  renderStrip();
  const d=ensureData(gd());
  const q=(document.getElementById('psearch').value||'').toLowerCase();
  const pts=d.patients.filter(p=>p.name.toLowerCase().includes(q)||(p.phone||'').includes(q));
  const el=document.getElementById('patient-list');
  if(!pts.length){el.innerHTML=`<div class="empty"><i class="ti ti-users"></i>${d.patients.length?'No match found.':'No patients yet.<br>Tap + to add your first patient.'}</div>`;return;}
  el.innerHTML=pts.map(p=>{
    const b=bal(p.id);
    const bTxt=b<0?fmtAmt(b)+' due':b>0?fmtAmt(b)+' credit':'Settled';
    const bCls=b<0?'b-due':b>0?'b-credit':'b-ok';
    const ac=acolor(p.name);
    const remCount=d.reminders.filter(r=>r.pid===p.id&&!r.done).length;
    const rb=remCount?`<span class="badge b-remind" style="margin-right:4px;font-size:10px"><i class="ti ti-bell" style="font-size:10px"></i> ${remCount}</span>`:'';
    return `<div class="card" onclick="openDetail('${p.id}')">
      <div class="card-row">
        <div style="display:flex;align-items:center;flex:1;min-width:0;gap:12px">
          <div class="avatar" style="width:44px;height:44px;font-size:15px;background:${ac}18;color:${ac}">${initials(p.name)}</div>
          <div style="min-width:0">
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px">${rb}<span class="p-name">${p.name}</span></div>
            <div class="p-sub">${p.phone||'No phone'}${p.address?' · '+p.address:''}</div>
          </div>
        </div>
        <span class="badge ${bCls}" style="flex-shrink:0">${bTxt}</span>
      </div>
    </div>`;
  }).join('');
}

/* ── ADD/EDIT PATIENT ── */
function openAddPatient(){
  ['p-id','p-name','p-phone','p-address','p-charge'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('p-history').value='';
  document.getElementById('m-patient-title').textContent='Add patient';
  document.getElementById('m-patient').classList.remove('hidden');
  setTimeout(()=>document.getElementById('p-name').focus(),300);
}
function savePatient(){
  const name=document.getElementById('p-name').value.trim();
  const phone=document.getElementById('p-phone').value.trim();
  if(!name){alert("Please enter the patient's name.");return;}
  const d=ensureData(gd());
  const id=document.getElementById('p-id').value;
  const normPhone=n=>n.replace(/[\s\-\(\)]/g,'');
  if(phone){
    const dup=d.patients.find(p=>p.id!==id&&p.phone&&normPhone(p.phone)===normPhone(phone));
    if(dup){alert('Phone already registered under "'+dup.name+'".\nPlease check before adding a duplicate.');return;}
  }
  const dupName=d.patients.find(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase());
  if(dupName){if(!confirm('A patient named "'+dupName.name+'" already exists.\nAre you sure you want to add another?'))return;}
  const obj={name,phone,address:document.getElementById('p-address').value.trim(),defaultCharge:document.getElementById('p-charge').value,history:document.getElementById('p-history').value.trim()};
  if(id){const idx=d.patients.findIndex(p=>p.id===id);d.patients[idx]={...d.patients[idx],...obj};}
  else d.patients.push({id:uid(),...obj,createdAt:new Date().toISOString()});
  sd(d);closeModal('m-patient');renderPatients();
  if(curPid)openDetail(curPid,true);
}

            <div class="p-name">${l.name}</div>

            ${l.followDate?`<div class="followup-date"><i class="ti ti-phone" style="font-size:12px"></i>Follow up: ${fmtDate(l.followDate)}${l.followTime?' · '+l.followTime:''}</div>`:''}
          </div>
        </div>
        <span class="lead-status ${statusCls}">${statusTxt}</span>

function openAddLead(editId){
  const d=ensureData(gd());
  document.getElementById('lead-id').value=editId||'';
  document.getElementById('m-lead-title').textContent=editId?'Edit follow-up':'Add follow-up';
  if(editId){
    const l=d.leads.find(x=>x.id===editId);
    if(l){
      document.getElementById('lead-name').value=l.name;
      document.getElementById('lead-phone').value=l.phone||'';
      document.getElementById('lead-condition').value=l.condition||'';
      document.getElementById('lead-source').value=l.source||'';
      document.getElementById('lead-followdate').value=l.followDate||'';
      document.getElementById('lead-followtime').value=l.followTime||'';
      document.getElementById('lead-notes').value=l.notes||'';
    }
  } else {
    ['lead-name','lead-phone','lead-condition','lead-source','lead-followdate','lead-followtime','lead-notes'].forEach(id=>document.getElementById(id).value='');
  }
  document.getElementById('m-lead').classList.remove('hidden');
}
function saveLead(){
  const name=document.getElementById('lead-name').value.trim();
  const phone=document.getElementById('lead-phone').value.trim();
  if(!name){alert('Please enter a name.');return;}
  const d=ensureData(gd());
  const editId=document.getElementById('lead-id').value;
  const obj={name,phone,condition:document.getElementById('lead-condition').value.trim(),source:document.getElementById('lead-source').value.trim(),followDate:document.getElementById('lead-followdate').value,followTime:document.getElementById('lead-followtime').value,notes:document.getElementById('lead-notes').value.trim(),status:'new'};
  if(editId){const idx=d.leads.findIndex(l=>l.id===editId);d.leads[idx]={...d.leads[idx],...obj};}
  else d.leads.push({id:uid(),...obj,createdAt:new Date().toISOString()});
  sd(d);closeModal('m-lead');renderLeads();
  if(curLeadId)openLeadDetail(curLeadId);
}

let curLeadId=null;

  curLeadId=lid;

function convertLead(lid){
  if(!confirm('Convert this follow-up to a patient?\nThey will be added to your main patient list.'))return;
  const d=ensureData(gd());
  const l=d.leads.find(x=>x.id===lid);if(!l)return;
  // Pre-fill patient modal with lead info
  d.leads.find(x=>x.id===lid).status='converted';
  sd(d);
  document.getElementById('p-id').value='';
  document.getElementById('p-name').value=l.name;
  document.getElementById('p-phone').value=l.phone||'';
  document.getElementById('p-address').value='';
  document.getElementById('p-charge').value='';
  document.getElementById('p-history').value=l.condition||'';
  document.getElementById('m-patient-title').textContent='Add patient';
  goBackLead();
  switchTab('patients');
  document.getElementById('m-patient').classList.remove('hidden');
}
function deleteLead(lid){
  if(!confirm('Delete this follow-up? This cannot be undone.'))return;
  const d=ensureData(gd());
  d.leads=d.leads.filter(l=>l.id!==lid);
  sd(d);goBackLead();
}
function goBackLead(){curLeadId=null;switchTab('leads');}

/* ── REMINDERS SCREEN ── */
function renderReminders(){
  const d=ensureData(gd());
  const today=todayStr();
  const rems=d.reminders.filter(r=>!r.done).sort((a,b)=>a.date.localeCompare(b.date));
  const done=d.reminders.filter(r=>r.done).slice(-5);
  const el=document.getElementById('reminder-list');
  let html='';
  if(!rems.length&&!done.length){el.innerHTML=`<div class="empty"><i class="ti ti-bell"></i>No reminders set.<br>Open a patient and tap Remind.</div>`;return;}
  if(rems.length){
    html+=rems.map(r=>{
      const p=d.patients.find(x=>x.id===r.pid);
      const overdue=r.date<today;
      return `<div class="card">
        <div class="card-row">
          <div style="display:flex;gap:10px;align-items:flex-start;flex:1">
            <div style="width:36px;height:36px;border-radius:50%;background:${overdue?'var(--pink-light)':'#fff8e1'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ti ti-bell" style="font-size:18px;color:${overdue?'var(--pink)':'#b7770d'}"></i>
            </div>
            <div>
              <div style="font-size:14px;font-weight:700;color:${overdue?'var(--pink)':'#1a1a1a'}">${r.note}</div>
              <div class="p-sub">${p?p.name:''}${r.date?' · '+fmtDate(r.date):''}${r.time?' · '+r.time:''}</div>
              ${overdue?`<div style="font-size:11px;color:var(--pink);font-weight:700">⚠️ Overdue</div>`:''}
            </div>
          </div>
          <button class="log-edit" style="font-size:20px;color:var(--teal)" onclick="doneReminder('${r.id}')" title="Mark done"><i class="ti ti-circle-check"></i></button>
        </div>
      </div>`;}).join('');
  }
  if(done.length){
    html+=`<div class="sec-label">Recently done</div>`;
    html+=done.map(r=>{const p=d.patients.find(x=>x.id===r.pid);
      return `<div class="card" style="opacity:.5"><div style="font-size:13px;text-decoration:line-through">${r.note}</div><div class="p-sub">${p?p.name:''}</div></div>`;
    }).join('');
  }
  el.innerHTML=html;
}

/* ── TABS ── */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  curPid=null;curLeadId=null;
  if(tab==='patients')renderPatients();
  if(tab==='visits')renderAllVisits();
  if(tab==='schedule')renderAllSchedules();
  if(tab==='leads')renderLeads();
  if(tab==='reminders')renderReminders();
}

function fmtDateFull(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function triggerDownload(filename,content,mime){
  const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);
}

function exportAllCSV(){

  tx.forEach(t=>{const p=d.patients.find(x=>x.id===t.pid);csv+=`"${p?p.name:'Unknown'}",${t.type},${t.date},${t.time},"${t.notes.replace(/"/g,"''")}",${t.amount}\n`;});

}
