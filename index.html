<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --pink:#D4537E;--pink-light:#FBEAF0;--pink-mid:#F4C0D1;--pink-dark:#72243E;
    --teal:#1D9E75;--teal-light:#E1F5EE;--teal-mid:#9FE1CB;--teal-dark:#085041;
    --bg:#f7f7f8;--card:#ffffff;--border:#e8e8e8;--text:#1a1a1a;--muted:#6b7280;
  }
  html,body{height:100%;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--text);max-width:430px;margin:0 auto;overflow-x:hidden;}

  /* SPLASH */
  #splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;text-align:center;background:var(--bg);}
  .logo-ring{width:96px;height:96px;border-radius:50%;overflow:hidden;margin-bottom:22px;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both;}
  .logo-ring img{width:100%;height:100%;object-fit:cover;}
  .brand-row1{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.4px;line-height:1.2;}
  .brand-row2{font-size:26px;font-weight:800;color:var(--teal);letter-spacing:-.4px;line-height:1.2;}
  .brand-sub{font-size:12px;color:var(--pink);font-weight:700;letter-spacing:1px;margin-top:6px;text-transform:uppercase;}
  .splash-divider{width:44px;height:2.5px;background:var(--pink-mid);border-radius:2px;margin:18px auto;}
  .tagline{font-size:15px;color:var(--muted);line-height:1.65;max-width:260px;}
  .greet-line{font-size:13px;color:var(--muted);margin-top:8px;margin-bottom:28px;font-style:italic;}
  .splash-btn{background:var(--pink);color:#fff;border:none;border-radius:18px;padding:16px 44px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;}
  .splash-btn:active{transform:scale(0.97);opacity:.9;}
  .splash-stats{display:flex;gap:24px;margin-top:30px;}
  .splash-stat-val{font-size:22px;font-weight:800;color:var(--teal);}
  .splash-stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
  .version-tag{font-size:10px;color:#ccc;margin-top:20px;letter-spacing:.5px;}
  @keyframes popIn{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}

  /* APP */
  #app{display:none;}
  .app-header{background:var(--card);border-bottom:0.5px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:50;}
  .header-row{display:flex;align-items:center;justify-content:space-between;}
  .header-brand{display:flex;align-items:center;gap:10px;}
  .header-logo{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .header-logo img{width:100%;height:100%;object-fit:cover;}
  .header-title{font-size:16px;font-weight:800;color:var(--text);}
  .header-title span{color:var(--pink);}
  .header-sub{font-size:11px;color:var(--muted);margin-top:1px;}
  .header-add{background:var(--pink);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:22px;flex-shrink:0;transition:transform .1s;}
  .header-add:active{transform:scale(0.93);}

  /* Tab bar */
  .tab-bar{display:flex;background:var(--card);border-bottom:0.5px solid var(--border);}
  .tab{flex:1;padding:11px 4px 10px;border:none;background:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;}
  .tab i{font-size:21px;}
  .tab.active{color:var(--pink);border-bottom-color:var(--pink);}

  /* Screens */
  .screen{display:none;padding:14px 14px 90px;animation:fadeUp .2s ease both;}
  .screen.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* Summary strip */
  .summary-strip{display:flex;gap:8px;margin-bottom:14px;}
  .strip-card{flex:1;background:var(--card);border-radius:12px;border:0.5px solid var(--border);padding:10px 8px;text-align:center;}
  .strip-val{font-size:15px;font-weight:800;}
  .strip-lbl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;}

  /* Search */
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#bbb;font-size:17px;pointer-events:none;}
  .search-wrap input{width:100%;padding:10px 12px 10px 36px;border:0.5px solid var(--border);border-radius:13px;font-size:14px;background:var(--card);outline:none;color:var(--text);font-family:inherit;}
  .search-wrap input:focus{border-color:var(--pink);}

  /* Patient card */
  .p-card{background:var(--card);border-radius:16px;border:0.5px solid var(--border);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .p-card:active{border-color:var(--pink);transform:scale(0.99);}
  .p-card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
  .p-name{font-size:15px;font-weight:700;color:var(--text);}
  .p-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .b-due{background:var(--pink-light);color:var(--pink-dark);}
  .b-credit{background:var(--teal-light);color:var(--teal-dark);}
  .b-ok{background:#f0f0f0;color:#555;}
  .b-remind{background:#fff8e1;color:#92620a;}

  /* Detail */
  .back-row{display:flex;align-items:center;gap:4px;padding:8px 0 4px;cursor:pointer;color:var(--pink);font-size:14px;font-weight:700;border:none;background:none;margin-bottom:6px;}
  .det-header{background:var(--card);border-radius:18px;border:0.5px solid var(--border);padding:16px;margin-bottom:10px;}
  .det-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .det-name{font-size:20px;font-weight:800;}
  .det-phone{font-size:13px;color:var(--muted);margin-top:2px;}
  .big-bal{font-size:28px;font-weight:900;text-align:center;padding:8px 0 2px;}
  .bal-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px;}
  .action-row{display:flex;gap:7px;}
  .act-btn{flex:1;padding:11px 4px;border:0.5px solid var(--border);border-radius:13px;background:var(--card);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);transition:background .15s,border-color .15s,transform .1s;}
  .act-btn i{font-size:22px;}
  .act-btn:active{transform:scale(0.96);}
  .act-visit{color:var(--teal);border-color:var(--teal-mid);}
  .act-visit:active{background:var(--teal-light);}
  .act-pay{color:var(--pink);border-color:var(--pink-mid);}
  .act-pay:active{background:var(--pink-light);}
  .act-remind-on{color:#92620a;background:#fff8e1;border-color:#f0c040;}
  .act-edit{color:var(--muted);}
  .sec-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin:14px 0 7px 2px;}
  .log-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:4px;}
  .log-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:0.5px solid #f3f3f3;}
  .log-item:last-child{border-bottom:none;}
  .log-d{font-size:13px;color:var(--text);font-weight:500;}
  .log-n{font-size:11px;color:var(--muted);margin-top:2px;}
  .log-amt{font-size:14px;font-weight:800;}
  .amt-charge{color:var(--pink);}
  .amt-pay{color:var(--teal);}

  /* Visits */
  .v-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);padding:12px 14px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .1s;}
  .v-card:active{transform:scale(0.99);}
  .v-dot{width:9px;height:9px;border-radius:50%;background:var(--pink);flex-shrink:0;}
  .v-name{font-size:14px;font-weight:700;}
  .v-note{font-size:12px;color:var(--muted);}
  .v-amt{font-size:15px;font-weight:800;color:var(--pink);margin-left:auto;flex-shrink:0;}

  /* Reminder */
  .rem-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);padding:13px 14px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .1s;}
  .rem-card:active{transform:scale(0.99);}
  .remind-icon{width:42px;height:42px;border-radius:50%;background:#fff8e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .remind-icon i{font-size:21px;color:#b7770d;}

  /* Empty */
  .empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;line-height:1.6;}
  .empty i{font-size:48px;display:block;margin-bottom:14px;color:#ddd;}

  /* Quick btn */
  .quick-btn{width:100%;background:var(--pink);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .15s;}
  .quick-btn:active{transform:scale(0.98);opacity:.9;}

  /* Update banner */
  .update-banner{background:#1a1a1a;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;}
  .update-banner.hidden{display:none;}
  .update-btn{background:var(--pink);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
  .modal-bg.hidden{display:none;}
  .modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px 40px;max-height:90vh;overflow-y:auto;}
  .modal-pill{width:38px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 18px;}
  .modal-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text);}
  .modal-title i{color:var(--pink);}
  label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.5px;}
  label:first-of-type{margin-top:0;}
  input,select{width:100%;border:0.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;color:var(--text);background:var(--card);appearance:none;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(212,83,126,.12);}
  .m-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;font-family:inherit;transition:transform .1s,opacity .15s;}
  .m-btn:active{transform:scale(0.98);opacity:.9;}
  .m-btn-pink{background:var(--pink);color:#fff;}
  .m-btn-ghost{background:#f0f0f0;color:var(--muted);margin-top:9px;}
</style>
</head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script>
/* ══════════════════════════════════
   APP VERSION — bump this when you
   push any update to GitHub
   ══════════════════════════════════ */
const APP_VERSION = 'v1.0.0';

/* ── DATA ── */
const STORE_KEY = 'vpc_v1';
function gd(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{"patients":[],"visits":[],"payments":[]}')}catch(e){return{patients:[],visits:[],payments:[]};}}
function sd(d){localStorage.setItem(STORE_KEY,JSON.stringify(d));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ── BALANCE ── */
function bal(pid){
  const d=gd();
  const charged=d.visits.filter(v=>v.pid===pid).reduce((a,v)=>a+Number(v.charge),0);
  const paid=d.payments.filter(x=>x.pid===pid).reduce((a,x)=>a+Number(x.amount),0);
  return paid-charged;
}

/* ── HELPERS ── */
const COLORS=['#D4537E','#1D9E75','#7F77DD','#D85A30','#185FA5','#BA7517','#993556','#0F6E56'];
function acolor(n){let h=0;for(let c of n)h+=c.charCodeAt(0);return COLORS[h%COLORS.length];}
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function fmtDate(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtAmt(n){return '₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');}
function bgClose(e,id){if(e.target.id===id)closeModal(id);}
function closeModal(id){document.getElementById(id).classList.add('hidden');}

/* ── SERVICE WORKER + AUTO UPDATE ── */
let swReg=null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    swReg=reg;
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          document.getElementById('update-banner').classList.remove('hidden');
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
function applyUpdate(){
  if(swReg&&swReg.waiting){
    swReg.waiting.postMessage('SKIP_WAITING');
  }
}

/* ── GREETING ── */
function greetText(){
  const h=new Date().getHours();
  const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return g+', Vanshika Rao! Happy '+days[new Date().getDay()]+'.';
}

/* ── SPLASH ── */
function initSplash(){
  document.getElementById('greet-line').textContent=greetText();
  document.getElementById('version-tag').textContent=APP_VERSION;
  const d=gd();
  if(d.patients.length>0){
    const totalOut=d.patients.reduce((a,p)=>{const b=bal(p.id);return b<0?a+Math.abs(b):a;},0);
    const rems=d.patients.filter(p=>p.remind).length;
    document.getElementById('splash-stats').innerHTML=
      `<div class="splash-stat"><div class="splash-stat-val">${d.patients.length}</div><div class="splash-stat-lbl">Patients</div></div>
       <div class="splash-stat"><div class="splash-stat-val" style="color:var(--pink)">${fmtAmt(totalOut)}</div><div class="splash-stat-lbl">Outstanding</div></div>
       <div class="splash-stat"><div class="splash-stat-val" style="color:#b7770d">${rems}</div><div class="splash-stat-lbl">Reminders</div></div>`;
  }
}
function enterApp(){
  document.getElementById('splash').style.display='none';
  document.getElementById('app').style.display='block';
  renderPatients();
}

/* ── STRIP ── */
function renderStrip(){
  const d=gd();
  const out=d.patients.reduce((a,p)=>{const b=bal(p.id);return b<0?a+Math.abs(b):a;},0);
  const cr=d.patients.reduce((a,p)=>{const b=bal(p.id);return b>0?a+b:a;},0);
  const rems=d.patients.filter(p=>p.remind).length;
  document.getElementById('strip').innerHTML=
    `<div class="summary-strip">
      <div class="strip-card"><div class="strip-val" style="color:var(--pink)">${fmtAmt(out)}</div><div class="strip-lbl">Outstanding</div></div>
      <div class="strip-card"><div class="strip-val" style="color:var(--teal)">${fmtAmt(cr)}</div><div class="strip-lbl">Credit</div></div>
      <div class="strip-card"><div class="strip-val" style="color:#b7770d">${rems}</div><div class="strip-lbl">Reminders</div></div>
    </div>`;
}

/* ── PATIENTS ── */
function renderPatients(){
  renderStrip();
  const d=gd();
  const q=(document.getElementById('psearch').value||'').toLowerCase();
  const pts=d.patients.filter(p=>p.name.toLowerCase().includes(q)||(p.phone||'').includes(q));
  const el=document.getElementById('patient-list');
  if(!pts.length){
    el.innerHTML=`<div class="empty"><i class="ti ti-users"></i>${d.patients.length?'No patients match.':'No patients yet.<br>Tap + to add your first patient.'}</div>`;
    return;
  }
  el.innerHTML=pts.map(p=>{
    const b=bal(p.id);
    const bTxt=b<0?fmtAmt(b)+' due':b>0?fmtAmt(b)+' credit':'Settled';
    const bCls=b<0?'b-due':b>0?'b-credit':'b-ok';
    const ac=acolor(p.name);
    const rb=p.remind?`<span class="badge b-remind" style="margin-right:4px;font-size:10px"><i class="ti ti-bell" style="font-size:11px"></i></span>`:'';
    return `<div class="p-card" onclick="openDetail('${p.id}')">
      <div class="p-card-row">
        <div style="display:flex;align-items:center;flex:1;min-width:0;gap:12px">
          <div class="avatar" style="width:44px;height:44px;font-size:15px;background:${ac}18;color:${ac}">${initials(p.name)}</div>
          <div style="min-width:0">
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">${rb}<span class="p-name">${p.name}</span></div>
            <div class="p-sub">${p.phone||'No phone'}${p.address?' · '+p.address:''}</div>
          </div>
        </div>
        <span class="badge ${bCls}" style="flex-shrink:0;margin-left:8px">${bTxt}</span>
      </div>
    </div>`;
  }).join('');
}

/* ── ADD/EDIT PATIENT ── */
function openAddPatient(){
  ['p-id','p-name','p-phone','p-address','p-charge'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('m-patient-title').textContent='Add patient';
  document.getElementById('m-patient').classList.remove('hidden');
  setTimeout(()=>document.getElementById('p-name').focus(),300);
}
function savePatient(){
  const name=document.getElementById('p-name').value.trim();
  if(!name){alert('Please enter the patient\'s name.');return;}
  const d=gd();const id=document.getElementById('p-id').value;
  const obj={name,phone:document.getElementById('p-phone').value.trim(),address:document.getElementById('p-address').value.trim(),defaultCharge:document.getElementById('p-charge').value};
  if(id){const idx=d.patients.findIndex(p=>p.id===id);d.patients[idx]={...d.patients[idx],...obj};}
  else d.patients.push({id:uid(),...obj,remind:false,createdAt:new Date().toISOString()});
  sd(d);closeModal('m-patient');renderPatients();
  if(curPid)openDetail(curPid,true);
}

/* ── VISIT ── */
function openAddVisit(pid){
  const d=gd();
  if(!d.patients.length){alert('Please add a patient first.');return;}
  const sel=document.getElementById('v-pat');
  sel.innerHTML=d.patients.map(p=>`<option value="${p.id}"${p.id===pid?' selected':''}>${p.name}</option>`).join('');
  if(pid){const p=d.patients.find(x=>x.id===pid);document.getElementById('v-charge').value=(p&&p.defaultCharge)?p.defaultCharge:'';}
  else document.getElementById('v-charge').value='';
  document.getElementById('v-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('v-time').value=new Date().toTimeString().slice(0,5);
  document.getElementById('v-notes').value='';
  document.getElementById('m-visit').classList.remove('hidden');
}
document.getElementById('v-pat').addEventListener('change',function(){
  const d=gd();const p=d.patients.find(x=>x.id===this.value);
  if(p&&p.defaultCharge)document.getElementById('v-charge').value=p.defaultCharge;
});
function saveVisit(){
  const pid=document.getElementById('v-pat').value;
  const charge=document.getElementById('v-charge').value;
  const date=document.getElementById('v-date').value;
  if(!pid||!charge||!date){alert('Please fill patient, date, and charge.');return;}
  const d=gd();
  d.visits.push({id:uid(),pid,date,time:document.getElementById('v-time').value,charge:Number(charge),notes:document.getElementById('v-notes').value.trim(),createdAt:new Date().toISOString()});
  sd(d);closeModal('m-visit');renderPatients();renderAllVisits();
  if(curPid)openDetail(curPid,true);
}

/* ── PAYMENT ── */
function openPayment(pid){
  document.getElementById('pay-pid').value=pid;
  document.getElementById('pay-amt').value='';
  document.getElementById('pay-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('pay-note').value='';
  document.getElementById('m-payment').classList.remove('hidden');
  setTimeout(()=>document.getElementById('pay-amt').focus(),300);
}
function savePayment(){
  const pid=document.getElementById('pay-pid').value;
  const amount=document.getElementById('pay-amt').value;
  const date=document.getElementById('pay-date').value;
  if(!amount||!date){alert('Please fill amount and date.');return;}
  const d=gd();
  d.payments.push({id:uid(),pid,amount:Number(amount),date,note:document.getElementById('pay-note').value.trim(),createdAt:new Date().toISOString()});
  sd(d);closeModal('m-payment');renderPatients();
  if(curPid)openDetail(curPid,true);
}

/* ── DETAIL ── */
let curPid=null;
function openDetail(pid,stay){
  curPid=pid;
  const d=gd();const p=d.patients.find(x=>x.id===pid);if(!p)return;
  const b=bal(pid);
  const balColor=b<0?'var(--pink)':b>0?'var(--teal)':'#888';
  const balTxt=b<0?fmtAmt(b)+' outstanding':b>0?fmtAmt(b)+' credit balance':'All settled up ✓';
  const visits=d.visits.filter(v=>v.pid===pid).sort((a,c)=>c.date.localeCompare(a.date));
  const pays=d.payments.filter(x=>x.pid===pid).sort((a,c)=>c.date.localeCompare(a.date));
  const totalCharged=visits.reduce((a,v)=>a+Number(v.charge),0);
  const totalPaid=pays.reduce((a,x)=>a+Number(x.amount),0);
  const ac=acolor(p.name);
  document.getElementById('detail-body').innerHTML=`
    <div class="det-header">
      <div class="det-top">
        <div class="avatar" style="width:54px;height:54px;font-size:18px;background:${ac}18;color:${ac}">${initials(p.name)}</div>
        <div><div class="det-name">${p.name}</div><div class="det-phone">${p.phone||'No phone'}${p.address?' · '+p.address:''}</div></div>
      </div>
      <div class="big-bal" style="color:${balColor}">${balTxt}</div>
      <div class="bal-sub">${visits.length} visit${visits.length!==1?'s':''} &nbsp;·&nbsp; ${fmtAmt(totalCharged)} charged &nbsp;·&nbsp; ${fmtAmt(totalPaid)} paid</div>
      <div class="action-row">
        <button class="act-btn act-visit" onclick="openAddVisit('${pid}')"><i class="ti ti-plus"></i>Visit</button>
        <button class="act-btn act-pay" onclick="openPayment('${pid}')"><i class="ti ti-cash"></i>Payment</button>
        <button class="act-btn ${p.remind?'act-remind-on':''}" onclick="toggleRemind('${pid}')"><i class="ti ti-bell"></i>${p.remind?'Reminded':'Remind'}</button>
        <button class="act-btn act-edit" onclick="editPatient('${pid}')"><i class="ti ti-edit"></i>Edit</button>
      </div>
    </div>
    <div class="sec-label">Visit history</div>
    <div class="log-card">
      ${visits.length?visits.map(v=>`<div class="log-item"><div><div class="log-d">${fmtDate(v.date)}${v.time?' · '+v.time:''}</div>${v.notes?`<div class="log-n">${v.notes}</div>`:''}</div><div class="log-amt amt-charge">−${fmtAmt(v.charge)}</div></div>`).join(''):`<div class="empty" style="padding:20px">No visits yet.</div>`}
    </div>
    <div class="sec-label">Payment history</div>
    <div class="log-card">
      ${pays.length?pays.map(pm=>`<div class="log-item"><div><div class="log-d">${fmtDate(pm.date)}</div>${pm.note?`<div class="log-n">${pm.note}</div>`:''}</div><div class="log-amt amt-pay">+${fmtAmt(pm.amount)}</div></div>`).join(''):`<div class="empty" style="padding:20px">No payments yet.</div>`}
    </div>`;
  if(!stay){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-detail').classList.add('active');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  }
}
function editPatient(pid){
  const d=gd();const p=d.patients.find(x=>x.id===pid);if(!p)return;
  document.getElementById('p-id').value=p.id;
  document.getElementById('p-name').value=p.name;
  document.getElementById('p-phone').value=p.phone||'';
  document.getElementById('p-address').value=p.address||'';
  document.getElementById('p-charge').value=p.defaultCharge||'';
  document.getElementById('m-patient-title').textContent='Edit patient';
  document.getElementById('m-patient').classList.remove('hidden');
}
function toggleRemind(pid){
  const d=gd();const i=d.patients.findIndex(p=>p.id===pid);
  d.patients[i].remind=!d.patients[i].remind;sd(d);
  renderPatients();renderReminders();openDetail(pid,true);
}
function goBack(){curPid=null;switchTab('patients');}

/* ── ALL VISITS ── */
function renderAllVisits(){
  const d=gd();
  const vs=[...d.visits].sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('all-visits');
  if(!vs.length){el.innerHTML=`<div class="empty"><i class="ti ti-stethoscope"></i>No visits logged yet.</div>`;return;}
  el.innerHTML=`<button class="quick-btn" onclick="openAddVisit(null)"><i class="ti ti-plus" style="font-size:18px"></i> Log a visit</button>`+
    vs.map(v=>{const p=d.patients.find(x=>x.id===v.pid);
      return `<div class="v-card" onclick="openDetail('${v.pid}')">
        <div class="v-dot"></div>
        <div style="min-width:64px"><div style="font-size:12px;color:var(--muted);font-weight:600">${fmtDate(v.date)}</div>${v.time?`<div style="font-size:11px;color:var(--muted)">${v.time}</div>`:''}</div>
        <div style="flex:1;min-width:0"><div class="v-name">${p?p.name:'Unknown'}</div>${v.notes?`<div class="v-note">${v.notes}</div>`:''}</div>
        <div class="v-amt">₹${Number(v.charge).toLocaleString('en-IN')}</div>
      </div>`;
    }).join('');
}

/* ── REMINDERS ── */
function renderReminders(){
  const d=gd();const pts=d.patients.filter(p=>p.remind);
  const el=document.getElementById('reminder-list');
  if(!pts.length){el.innerHTML=`<div class="empty"><i class="ti ti-bell"></i>No reminders set.<br>Open a patient and tap Remind.</div>`;return;}
  el.innerHTML=pts.map(p=>{
    const b=bal(p.id);
    const bTxt=b<0?fmtAmt(b)+' due':b>0?fmtAmt(b)+' credit':'Settled';
    const bCls=b<0?'b-due':b>0?'b-credit':'b-ok';
    return `<div class="rem-card" onclick="openDetail('${p.id}')">
      <div class="remind-icon"><i class="ti ti-bell"></i></div>
      <div style="flex:1;min-width:0"><div class="p-name">${p.name}</div><div class="p-sub">${p.phone||'No phone'}${p.address?' · '+p.address:''}</div></div>
      <span class="badge ${bCls}" style="flex-shrink:0">${bTxt}</span>
    </div>`;
  }).join('');
}

/* ── TABS ── */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  curPid=null;
  if(tab==='patients')renderPatients();
  if(tab==='visits')renderAllVisits();
  if(tab==='reminders')renderReminders();
}

/* ── INIT ── */
initSplash();
</script>
